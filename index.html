<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ecf4fb">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>기록형 연습 — 변호사시험</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

<script>
// 테마는 네 앱이 같은 키를 쓴다. 없으면 라이트.
(function(){
  var t = localStorage.getItem('cp_theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
})();

<style>
:root[data-theme="dark"]{
  --bg:#10192a; --sf:#172238; --sf2:#1d2d48; --bd:#284060; --bd2:#1e3254;
  --gold:#7ab8d8; --gold2:#9acce8;
  --tx:#cce6f8; --tx2:#6aa8cc; --tx3:#366078;
  --hd:#0c1424; --ok:#4ade80; --no:#f87171; --shadow:0 1px 3px rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --bg:#ecf4fb; --sf:#ffffff; --sf2:#dceef8; --bd:#b4d0e8; --bd2:#cce0f2;
  --gold:#2464a0; --gold2:#2e74b5;
  --tx:#192233; --tx2:#3a5870; --tx3:#5878a0;
  --hd:#16233a; --ok:#16a34a; --no:#dc2626; --shadow:0 1px 3px rgba(30,60,100,.10);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:'Pretendard Variable',Pretendard,system-ui,-apple-system,"Malgun Gothic",sans-serif;
  line-height:1.7;-webkit-text-size-adjust:100%}
#root{min-height:100vh}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
.wrap.wide{max-width:1840px;padding:16px 20px}
.hd{background:var(--hd);color:#e8f2fb;padding:13px 18px;display:flex;
  align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:30}
.hd h1{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.02em}
.hd .sub{font-size:11.5px;opacity:.72;margin-top:2px}
.btn{background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:8px;
  padding:8px 13px;font-size:13px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--gold2)}
.btn:disabled{opacity:.42;cursor:default}
.btn.ghost{background:transparent;color:#cfe3f5;border-color:rgba(255,255,255,.22)}
select.btn{padding:7px 10px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;
  padding:15px;margin-bottom:11px;box-shadow:var(--shadow)}
.card.click{cursor:pointer}
.card.click:hover{border-color:var(--gold)}
.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;
  background:var(--sf2);color:var(--tx2);border:1px solid var(--bd2)}
.tag.on{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:600}
.tag.gold{color:var(--gold);border-color:var(--gold);font-weight:600}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.tag.click{cursor:pointer}
.muted{color:var(--tx3);font-size:12px}
.title{font-size:14.5px;font-weight:700;margin:0 0 9px}
.pre{white-space:pre-wrap;word-break:break-word;font-size:14.6px;line-height:1.95;color:var(--tx)}
.empty{text-align:center;color:var(--tx3);padding:44px 16px}
textarea{width:100%;background:var(--sf);color:var(--tx);border:1px solid var(--bd);
  border-radius:10px;padding:14px;font-size:15px;font-family:inherit;resize:vertical;
  line-height:28px;min-height:max(320px,calc(100vh - 300px));
  background-image:repeating-linear-gradient(to bottom,
    transparent 0,transparent 27px,var(--bd2) 27px,var(--bd2) 28px);
  background-position:0 14px}
textarea:focus{outline:none;border-color:var(--gold)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:14px;overflow-x:auto}
.tab{padding:10px 14px;font-size:13.5px;color:var(--tx2);cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--gold);border-bottom-color:var(--gold);font-weight:700}

/* 기록형은 기록이 수만 자다. 좌우로 나누고 각각 따로 스크롤한다 —
   위아래로 쌓으면 서면을 쓰면서 기록을 보려고 계속 오르내려야 한다. */
.solve{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.col{display:flex;flex-direction:column;gap:11px;min-width:0;
  max-height:calc(100vh - 90px);overflow-y:auto;padding-right:4px}
.col .card{margin-bottom:0}
@media(max-width:900px){
  .solve{grid-template-columns:1fr}
  .col{max-height:none;overflow:visible}
}
</style>
