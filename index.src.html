<style>
:root[data-theme="dark"]{
  --bg:#10192a; --sf:#172238; --sf2:#1d2d48; --bd:#284060; --bd2:#1e3254;
  --gold:#7ab8d8; --gold2:#9acce8;
  --tx:#cce6f8; --tx2:#6aa8cc; --tx3:#366078;
  --hd:#0c1424; --ok:#4ade80; --no:#f87171; --shadow:0 1px 3px rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --bg:#ecf4fb; --sf:#ffffff; --sf2:#dceef8; --bd:#b4d0e8; --bd2:#cce0f2;
  --gold:#2464a0; --gold2:#2e74b5;
  --tx:#192233; --tx2:#3a5870; --tx3:#5878a0;
  --hd:#16233a; --ok:#16a34a; --no:#dc2626; --shadow:0 1px 3px rgba(30,60,100,.10);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:'Pretendard Variable',Pretendard,system-ui,-apple-system,"Malgun Gothic",sans-serif;
  line-height:1.7;-webkit-text-size-adjust:100%}
#root{min-height:100vh}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
.wrap.wide{max-width:1840px;padding:16px 20px}
.hd{background:var(--hd);color:#e8f2fb;padding:13px 18px;display:flex;
  align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:30}
.hd h1{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.02em}
.hd .sub{font-size:11.5px;opacity:.72;margin-top:2px}
.btn{background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:8px;
  padding:8px 13px;font-size:13px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--gold2)}
.btn:disabled{opacity:.42;cursor:default}
.btn.ghost{background:transparent;color:#cfe3f5;border-color:rgba(255,255,255,.22)}
select.btn{padding:7px 10px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;
  padding:15px;margin-bottom:11px;box-shadow:var(--shadow)}
.card.click{cursor:pointer}
.card.click:hover{border-color:var(--gold)}
.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;
  background:var(--sf2);color:var(--tx2);border:1px solid var(--bd2)}
.tag.on{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:600}
.tag.gold{color:var(--gold);border-color:var(--gold);font-weight:600}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.tag.click{cursor:pointer}
/* ── 채점 결과 보기 — 「빨간 펜으로 첨삭한 종이」 ──────────────
   전에는 마크다운을 평문으로 뿌려서 표의 |, 제목의 ##, 강조의 ** 가
   화면에 그대로 보였다. 아래 스타일은 그걸 사람이 읽는 모양으로 만든다. */
.gv-h{font-weight:700;margin:16px 0 8px;color:var(--tx)}
.gv-h2{font-size:15.5px;padding-bottom:5px;border-bottom:1px solid var(--bd2)}
.gv-h3{font-size:14px} .gv-h4{font-size:13.5px;color:var(--tx2)}
.gv-p{font-size:14.4px;line-height:1.85;margin:6px 0;color:var(--tx)}
.gv-li{font-size:14.2px;line-height:1.8;margin:5px 0 5px 14px;position:relative;color:var(--tx)}
.gv-li::before{content:"·";position:absolute;left:-11px;color:var(--tx3)}
.gv-t{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
.gv-t th,.gv-t td{border:1px solid var(--bd2);padding:6px 8px;text-align:left;vertical-align:top}
.gv-t th{background:var(--sf2);font-weight:600;color:var(--tx2);white-space:nowrap}

/* 첨삭 카드 — 학생 문장 → 고칠 말 → 사유 */
.gv-card{border-left:3px solid var(--no);background:var(--sf2);
  border-radius:0 8px 8px 0;padding:10px 12px;margin:10px 0}
.gv-said{font-size:14px;line-height:1.8;color:var(--tx2)}
.gv-quote{color:var(--tx2)}
.gv-fixline{font-size:14.2px;line-height:1.85;margin-top:5px;color:var(--tx)}
.gv-del{color:var(--no);text-decoration:line-through;text-decoration-thickness:1.5px}
.gv-fix{color:var(--no);font-weight:700}
.gv-why{display:flex;gap:7px;align-items:baseline;margin-top:7px;
  font-size:13.2px;line-height:1.75;color:var(--tx2)}
.gv-tag{flex:none;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;
  background:var(--sf);border:1px solid var(--bd)}
.gv-bad .gv-tag{color:var(--no);border-color:var(--no)}
.gv-warn .gv-tag{color:var(--gold);border-color:var(--gold)}
.gv-good .gv-tag{color:var(--ok);border-color:var(--ok)}
.gv-mute .gv-tag{color:var(--tx3)}
.gv-good{border-color:var(--ok)}

/* 손가락으로 쓰는 기기에서 누를 것들을 키운다.
   필터 칩(.tag.click)이 27px, 상단 버튼이 35px 라 손끝으로 집기 어려웠다(권장 44px).
   마우스 화면은 지금 밀도가 알맞으므로 터치 기기에서만 손댄다. */
@media (pointer:coarse){
  .tag.click{min-height:36px;padding:8px 12px;display:inline-flex;align-items:center}
  .btn,.btn.ghost,select.btn{min-height:40px}
}
.muted{color:var(--tx3);font-size:12px}
.title{font-size:14.5px;font-weight:700;margin:0 0 9px}
.pre{white-space:pre-wrap;word-break:break-word;font-size:14.6px;line-height:1.95;color:var(--tx)}
.empty{text-align:center;color:var(--tx3);padding:44px 16px}
textarea{width:100%;background:var(--sf);color:var(--tx);border:1px solid var(--bd);
  border-radius:10px;padding:14px;font-size:15px;font-family:inherit;resize:vertical;
  line-height:28px;min-height:max(320px,calc(100vh - 300px));
  background-image:repeating-linear-gradient(to bottom,
    transparent 0,transparent 27px,var(--bd2) 27px,var(--bd2) 28px);
  background-position:0 14px}
textarea:focus{outline:none;border-color:var(--gold)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:14px;overflow-x:auto}
.tab{padding:10px 14px;font-size:13.5px;color:var(--tx2);cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--gold);border-bottom-color:var(--gold);font-weight:700}

/* 기록형은 기록이 수만 자다. 좌우로 나누고 각각 따로 스크롤한다 —
   위아래로 쌓으면 서면을 쓰면서 기록을 보려고 계속 오르내려야 한다. */
.solve{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.col{display:flex;flex-direction:column;gap:11px;min-width:0;
  max-height:calc(100vh - 90px);overflow-y:auto;padding-right:4px}
.col .card{margin-bottom:0}
@media(max-width:900px){
  .solve{grid-template-columns:1fr}
  .col{max-height:none;overflow:visible}
}
</style>

<body>
<div id="root"><div class="empty">불러오는 중…</div></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const SUBJECTS = ["공법","민사법","형사법"];
// 다른 앱(암기장 기출 연결 등)에서 특정 회차로 바로 여는 링크 — ?exam=민사법_변시_13회_기록
// 사례형 사이트와 같은 규칙이다. 과목은 id 앞머리에서 읽는다.
const INCOMING_EXAM = new URLSearchParams(location.search).get("exam");
const INCOMING_SUBJECT = INCOMING_EXAM && SUBJECTS.includes(INCOMING_EXAM.split("_")[0]) ? INCOMING_EXAM.split("_")[0] : null;

// AI 채점 Worker — 사례형과 같은 워커를 쓴다(시험 ID 꼬리 _기록 으로 갈린다).
// 비워 두면 채점 버튼만 숨고 나머지는 그대로 돌아간다.
// 채점 결과를 「선생님이 빨간 펜으로 첨삭한 종이」처럼 보이게 하는 뷰.
//
// 지금까지는 채점 결과(마크다운)를 <div class="pre"> 에 평문으로 뿌리고 있었다.
// 그래서 표의 `|`, 제목의 `##`, 강조의 `**` 가 화면에 그대로 노출됐다.
// 여기서 최소한의 마크다운만 직접 해석한다 — 라이브러리를 더 받지 않으려는 것이다
// (첫 화면 속도를 위해 babel 2.7MB 를 걷어낸 마당에 다시 늘릴 이유가 없다).
//
// 해석하는 것: ## 제목 / 표 / 인용(>) / **굵게** / ~~취소선~~ / [사유] 꼬리표 / 목록
// 첨삭 절의 세 줄 묶음(인용 → 고칠 말 → [사유])은 한 장의 「첨삭 카드」로 묶는다.

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// 줄 안쪽 서식. 취소선은 지운 글자, 굵게는 고쳐 쓸 말로 쓴다.
function inline(s) {
  let t = esc(s);
  t = t.replace(/~~(.+?)~~/g, '<span class="gv-del">$1</span>');
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong class="gv-fix">$1</strong>');
  t = t.replace(/「(.+?)」/g, '<span class="gv-quote">「$1」</span>');
  return t;
}

// [사유] 꼬리표 — 종류에 따라 색을 달리해 한눈에 구분되게 한다.
const REASON_CLASS = {
  '판례 근거 부족': 'warn', '판례 오기': 'bad', '조문 오기': 'bad',
  '정확성 부족': 'warn', '포섭 누락': 'warn', '논리 비약': 'warn',
  '결론 오류': 'bad', '불필요': 'mute', '좋음': 'good', '누락': 'warn',
};

function renderGrade(md) {
  const out = [];
  // 점수 마커는 앱이 배지로 쓰는 내부 표기다 — 본문에는 남기지 않는다.
  //   (스트리밍 중에는 조각으로 오므로 미완성 형태도 함께 지운다)
  const lines = String(md || '').replace(/\[\[SCORE:[^\]]*\]{0,2}/g, '').split('\n');
  let table = null;      // 표를 모으는 중인지
  let card = null;       // 첨삭 카드를 모으는 중인지

  const flushTable = () => {
    if (!table) return;
    const [head, ...body] = table;
    out.push(
      '<table class="gv-t"><thead><tr>' +
      head.map((c) => `<th>${inline(c)}</th>`).join('') +
      '</tr></thead><tbody>' +
      body.map((r) => '<tr>' + r.map((c) => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') +
      '</tbody></table>',
    );
    table = null;
  };
  const flushCard = () => {
    if (!card) return;
    out.push(`<div class="gv-card">${card.join('')}</div>`);
    card = null;
  };

  for (const raw of lines) {
    const t = raw.trim();

    // 표
    if (t.startsWith('|') && t.endsWith('|')) {
      const cells = t.slice(1, -1).split('|').map((c) => c.trim());
      if (cells.every((c) => /^:?-{2,}:?$/.test(c))) continue;   // 구분줄
      (table = table || []).push(cells);
      continue;
    }
    flushTable();

    if (!t) { flushCard(); continue; }

    // 제목
    const h = t.match(/^(#{2,4})\s+(.+)$/);
    if (h) {
      flushCard();
      const lv = h[1].length;
      out.push(`<div class="gv-h gv-h${lv}">${inline(h[2])}</div>`);
      continue;
    }

    // [사유] 꼬리표 — 첨삭 카드의 마지막 줄
    const r = t.match(/^>?\s*\[([^\]]+)\]\s*(.*)$/);
    if (r) {
      let name = r[1].trim(), rest = r[2];
      // 모델이 형식을 어겨 「[사유] 결론 오류 — …」로 쓰는 일이 있다.
      // 그대로 찍으면 「사유」라는 쓸모없는 딱지가 붙으므로 뒤에서 실제 사유를 끄집어낸다.
      if (name === '사유') {
        const m2 = rest.match(/^\s*([^—\-:]{2,12})\s*[—\-:]\s*(.*)$/);
        if (m2 && REASON_CLASS[m2[1].trim()]) { name = m2[1].trim(); rest = m2[2]; }
        else { const k = Object.keys(REASON_CLASS).find((x) => rest.startsWith(x));
               if (k) { name = k; rest = rest.slice(k.length).replace(/^\s*[—\-:]\s*/, ''); } }
      }
      const kind = REASON_CLASS[name] || 'warn';
      (card = card || []).push(
        `<div class="gv-why gv-${kind}"><span class="gv-tag">${esc(name)}</span>` +
        `<span>${inline(rest)}</span></div>`,
      );
      continue;
    }

    // 인용줄 — 학생 문장 또는 고쳐 쓸 말
    if (t.startsWith('>')) {
      const body = t.replace(/^>\s?/, '');
      // 학생 문장은 「」로 시작한다. 화살표가 없어도 「」로 시작하지 않는 줄은
      // 채점자가 쓴 고칠 말이다(누락 논점의 모범 문장, 덧붙일 문장).
      // 예전엔 화살표만 봐서 이런 줄이 학생 문장과 똑같은 모양으로 찍혔다.
      const isFix = /→/.test(body) || !/^「/.test(body.trim());
      (card = card || []).push(
        `<div class="${isFix ? 'gv-fixline' : 'gv-said'}">${inline(body)}</div>`,
      );
      continue;
    }
    flushCard();

    // 목록
    const li = t.match(/^[-*]\s+(.+)$/) || t.match(/^(\d+\.\s+.+)$/);
    if (li) { out.push(`<div class="gv-li">${inline(li[1])}</div>`); continue; }

    out.push(`<div class="gv-p">${inline(t)}</div>`);
  }
  flushTable(); flushCard();
  return out.join('');
}

const GRADER_URL = "https://case-grader.bar-exam.workers.dev";

const mmss = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;

async function getJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error(`${url} — ${r.status}`);
  return r.json();
}

/* ── 목록 ───────────────────────────────────────────── */
function List({subject, onOpen}){
  const [idx,setIdx] = useState(null);
  const [reg,setReg] = useState(null);      // 쟁점 레지스트리
  const [err,setErr] = useState(null);
  const [kind,setKind] = useState("전체");
  const [issue,setIssue] = useState("");    // 쟁점 필터(빈 값이면 전체)
  const [done,setDone] = useState({});

  useEffect(()=>{
    let live = true;
    setIdx(null); setErr(null); setIssue("");
    getJSON(`data/${encodeURIComponent(subject)}/index.json`)
      .then(d=>{ if(live) setIdx(d); })
      .catch(e=>{ if(live) setErr(`목록을 불러오지 못했습니다: ${e.message}`); });
    // 쟁점은 없어도 앱은 돌아간다 — 실패해도 목록은 띄운다.
    getJSON(`data/issues_${encodeURIComponent(subject)}.json`)
      .then(d=>{ if(live) setReg(d); })
      .catch(()=>{ if(live) setReg({issues:[]}); });
    Store.getProgress(subject,1).then(p=>{ if(live) setDone(p||{}); });
    return ()=>{ live = false; };
  },[subject]);

  if(err) return <div className="card" style={{borderColor:'var(--no)'}}>{err}</div>;
  if(!idx) return <div className="card">불러오는 중…</div>;

  const label = Object.fromEntries((reg?.issues||[]).map(i=>[i.id, i.label]));
  const exams = idx.exams.filter(e=>
    (kind==="전체" || e.kind===kind) &&
    (!issue || (e.issueIds||[]).includes(issue)));
  const doneCount = idx.exams.filter(e=>done[e.id]?.done).length;
  const tagged = idx.exams.filter(e=>(e.issueIds||[]).length).length;

  return (
    <div>
      <div className="card">
        <div className="row" style={{justifyContent:'space-between'}}>
          <div className="row">
            {["전체","변시","모의"].map(k=>
              <span key={k} className={"tag click"+(kind===k?" on":"")} onClick={()=>setKind(k)}>{k}</span>)}
          </div>
          <span className="muted">{idx.exams.length}회차 · 푼 것 {doneCount}</span>
        </div>
        {(reg?.issues||[]).length>0 &&
          <div className="row" style={{marginTop:10}}>
            <select className="btn" value={issue} onChange={e=>setIssue(e.target.value)}>
              <option value="">쟁점 전체</option>
              {reg.issues.map(i=>
                <option key={i.id} value={i.id}>{i.label} ({i.examCount})</option>)}
            </select>
            {issue && <button className="btn" onClick={()=>setIssue("")}>필터 해제</button>}
            <span className="muted">
              쟁점 있는 회차 {tagged}개 (해설·채점기준표 기준)</span>
          </div>}
      </div>

      {exams.map(e=>
        <div key={e.id} className="card click" onClick={()=>onOpen(e)}>
          <div className="row" style={{justifyContent:'space-between'}}>
            <strong>{e.label}</strong>
            <div className="row">
              {done[e.id]?.done && <span className="tag ok">푼 것</span>}
              {e.hasRubric
                ? <span className="tag gold">채점기준표</span>
                : <span className="tag">채점기준표 없음</span>}
              {e.hasCommentary &&
                <span className="tag ok">해설 {e.commentaryAuthors.join("·")}</span>}
            </div>
          </div>
          <div className="row" style={{marginTop:7}}>
            {e.tasks.length
              ? e.tasks.map(t=>
                  <span key={t.no} className="tag">
                    {t.title}{t.points?` ${t.points}점`:""}
                  </span>)
              : <span className="muted">작성할 서면을 자동으로 찾지 못했습니다 — 기록에서 확인하세요</span>}
            <span className="muted">· 기록 {Math.round(e.chars/1000)}천자</span>
          </div>
          {(e.issueIds||[]).length>0 &&
            <div className="row" style={{marginTop:6}}>
              {e.issueIds.slice(0,6).map(i=>
                <span key={i} className={"tag"+(i===issue?" on":"")}>{label[i]||i}</span>)}
              {e.issueIds.length>6 &&
                <span className="muted">외 {e.issueIds.length-6}개</span>}
            </div>}
        </div>)}
      {!exams.length && <div className="empty">해당하는 회차가 없습니다.</div>}
    </div>
  );
}

/* ── 풀이 ───────────────────────────────────────────── */
function Solve({subject, exam, onBack}){
  const [d,setD] = useState(null);
  const [err,setErr] = useState(null);
  const [tab,setTab] = useState(0);          // 과제 index
  const [answers,setAnswers] = useState({});
  const [elapsed,setElapsed] = useState(0);
  const [pane,setPane] = useState("record"); // record | rubric
  const [saved,setSaved] = useState(false);
  const [grades,setGrades] = useState({});   // 서면 키별 채점 상태

  // 과제를 못 뽑은 회차도 답안칸 하나로는 쓸 수 있어야 한다.
  const tasks = (d?.tasks?.length ? d.tasks : [{no:1,title:"답안",points:null}]);
  const cur = tasks[Math.min(tab,tasks.length-1)];
  const key = `t${cur.no}`;

  useEffect(()=>{
    let live = true;
    getJSON(`data/${encodeURIComponent(subject)}/exams/${exam.id}.json`)
      .then(async j=>{
        if(!live) return;
        setD(j);
        const list = j.tasks?.length ? j.tasks : [{no:1}];
        const drafts = {};
        for(const t of list){
          const v = await Store.getDraft(`${exam.id}::t${t.no}`);
          if(v) drafts[`t${t.no}`] = v;
        }
        if(live) setAnswers(drafts);
      })
      .catch(e=>{ if(live) setErr(`문제를 불러오지 못했습니다: ${e.message}`); });
    return ()=>{ live = false; };
  },[subject,exam.id]);

  useEffect(()=>{
    const t = setInterval(()=>setElapsed(s=>s+1),1000);
    return ()=>clearInterval(t);
  },[]);

  // 600ms 디바운스 사이에 탭을 닫으면 마지막 타이핑이 날아간다 —
  // 이탈 신호에 즉시 한 번 더 저장한다. (모바일은 visibilitychange 가 유일하게 믿을 만하다)
  const pending = React.useRef(null);
  const flushDraft = React.useCallback(()=>{
    const p = pending.current;
    if(!p) return;
    pending.current = null;
    clearTimeout(setAnswer._t);
    Store.setDraft(p.k, p.v);
  },[]);
  React.useEffect(()=>{
    const onHide = ()=>{ if(document.visibilityState === 'hidden') flushDraft(); };
    document.addEventListener('visibilitychange', onHide);
    window.addEventListener('pagehide', flushDraft);
    return ()=>{ document.removeEventListener('visibilitychange', onHide);
                 window.removeEventListener('pagehide', flushDraft); };
  },[flushDraft]);

  const setAnswer = (k,v)=>{
    setAnswers(a=>({...a,[k]:v})); setSaved(false);
    pending.current = { k:`${exam.id}::${k}`, v };
    clearTimeout(setAnswer._t);
    setAnswer._t = setTimeout(()=>{ pending.current = null;
      Store.setDraft(`${exam.id}::${k}`, v); }, 600);
  };

  const submit = async()=>{
    const parts = tasks.map(t=>{
      const v = (answers[`t${t.no}`]||"").trim();
      return v ? `【${t.title}】\n${v}` : null;
    }).filter(Boolean);
    if(!parts.length) return;
    await Store.record({
      subject, mode:"record", examId:exam.id, label:exam.label||(d&&d.label)||exam.id,
      round:1, issueIds:exam.issueIds||(d&&d.issueIds)||[], text:parts.join("\n\n"), seconds:elapsed,
    });
    const p = await Store.getProgress(subject,1);
    await Store.setProgress(subject,1,{...p,[exam.id]:{done:true,at:Date.now()}});
    setSaved(true);
  };

  // AI 채점 — Worker가 SSE로 흘려보내는 피드백을 받아 쌓는다.
  // 피드백 전문은 이 기기에만 남고(Store.record), 원격에는 점수·시간만 간다.
  const runGrade = async()=>{
    const text = (answers[key]||"").trim();
    if(!text || !GRADER_URL || grades[key]?.running) return;
    const put = v => setGrades(g=>({...g,[key]:{...(g[key]||{}),...v}}));
    put({running:true, text:"", score:null, error:null});
    try{
      const res = await fetch(GRADER_URL, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({subject, examId:exam.id, taskNo:cur.no, answer:text}),
      });
      if(!res.ok){
        const msg = await res.json().catch(()=>({error:`서버 오류 ${res.status}`}));
        put({running:false, error:msg.error||`서버 오류 ${res.status}`});
        return;
      }
      const reader = res.body.getReader(), dec = new TextDecoder();
      let buf = "", acc = "", errMsg = null;
      for(;;){
        const {value, done} = await reader.read();
        if(done) break;
        buf += dec.decode(value, {stream:true});
        const lines = buf.split("\n\n"); buf = lines.pop();
        for(const line of lines){
          if(!line.startsWith("data: ")) continue;
          let ev; try{ ev = JSON.parse(line.slice(6)); }catch{ continue; }
          if(ev.t){ acc += ev.t; put({text:acc}); }
          if(ev.error) errMsg = ev.error;
        }
      }
      const m = acc.match(/\[\[SCORE:\s*(\d+)\s*\]\]/);
      // 모델이 만점을 넘겨 적어도 기록·진도 집계가 무너지지 않게 만점에서 자른다
      const score = m ? Math.min(Number(m[1]), cur.points || 100) : null;
      const bodyText = acc.replace(/\[\[SCORE:[^\]]*\]\]/g, "").trim();
      put({running:false, text:bodyText, score, error:errMsg});
      if(score !== null){
        await Store.record({
          subject, mode:"record", examId:exam.id,
          label:`${exam.label||(d&&d.label)||exam.id} ${cur.title}`,
          round:1, issueIds:exam.issueIds||(d&&d.issueIds)||[], score,
          maxScore: cur.points || 100,
          text, feedback:bodyText, seconds:elapsed,
        });
      }
    }catch(e){
      put({running:false, error:`채점 요청 실패: ${e.message}`});
    }
  };

  if(err) return <div className="card" style={{borderColor:'var(--no)'}}>{err}
    <div><button className="btn" style={{marginTop:10}} onClick={onBack}>목록으로</button></div></div>;
  if(!d) return <div className="card">불러오는 중…</div>;

  const written = tasks.filter(t=>(answers[`t${t.no}`]||"").trim()).length;
  const grade = grades[key];

  return (
    <div>
      <div className="row" style={{justifyContent:'space-between',marginBottom:11}}>
        <button className="btn" onClick={onBack}>← 목록</button>
        <div className="row">
          <span className="muted">경과 {mmss(elapsed)}</span>
          <span className="muted">· 작성 {written}/{tasks.length}</span>
          {saved && <span className="tag ok">기록됨</span>}
        </div>
      </div>

      <div className="solve">
        {/* 왼쪽: 기록 */}
        <div className="col">
          <div className="card">
            <div className="tabs" style={{marginBottom:10}}>
              <div className={"tab"+(pane==="record"?" on":"")} onClick={()=>setPane("record")}>기록</div>
              {d.rubricText &&
                <div className={"tab"+(pane==="rubric"?" on":"")} onClick={()=>setPane("rubric")}>채점기준표</div>}
              {(d.commentaries||[]).length>0 &&
                <div className={"tab"+(pane==="comm"?" on":"")} onClick={()=>setPane("comm")}>
                  해설 ({d.commentaries.length})</div>}
            </div>
            {pane==="record" && <>
              {d.problemBlock &&
                <div className="card" style={{background:'var(--sf2)',marginBottom:11}}>
                  <div className="title">문제</div>
                  <div className="pre">{d.problemBlock}</div>
                </div>}
              <div className="pre">{d.problemText}</div>
            </>}
            {pane==="rubric" && (d.rubricText
              ? <div className="pre">{d.rubricText}</div>
              : <div className="empty">이 회차는 채점기준표가 공개되지 않았습니다.</div>)}
            {pane==="comm" && (d.commentaries||[]).map((c,i)=>
              <div key={i} style={{marginBottom:16}}>
                <div className="row" style={{marginBottom:7}}>
                  <span className="tag gold">{c.author}</span>
                  <span className="muted">{c.title} · {c.pageCount}쪽</span>
                </div>
                <div className="pre">{c.text}</div>
                {c.truncated &&
                  <div className="muted" style={{marginTop:7}}>
                    분량이 많아 앞부분만 실었습니다.</div>}
              </div>)}
          </div>
        </div>

        {/* 오른쪽: 답안 */}
        <div className="col">
          <div className="card">
            {tasks.length>1 &&
              <div className="tabs">
                {tasks.map((t,i)=>
                  <div key={t.no} className={"tab"+(i===tab?" on":"")} onClick={()=>setTab(i)}>
                    {t.title}{t.points?` (${t.points}점)`:""}
                    {(answers[`t${t.no}`]||"").trim() && " ✓"}
                  </div>)}
              </div>}
            <div className="row" style={{justifyContent:'space-between',marginBottom:8}}>
              <strong>{cur.title}{cur.points?` · ${cur.points}점`:""}</strong>
              <span className="muted">{(answers[key]||"").trim().length}자</span>
            </div>
            <textarea value={answers[key]||""} placeholder="여기에 서면을 작성하세요."
              onChange={e=>setAnswer(key, e.target.value)} />
            <div className="row" style={{marginTop:9}}>
              <button className="btn pri" onClick={submit} disabled={!written}>
                제출 · 기록 ({written}/{tasks.length})</button>
              {GRADER_URL &&
                <button className="btn" onClick={runGrade}
                  disabled={!(answers[key]||"").trim() || grade?.running}>
                  {grade?.running ? "채점 중…" : "AI 채점"}</button>}
              <button className="btn" onClick={async()=>{
                setAnswer(key,""); await Store.clearDraft(`${exam.id}::${key}`);
              }}>이 서면 비우기</button>
            </div>
          </div>
          {grade && (grade.text || grade.error || grade.running) &&
            <div className="card">
              <div className="row" style={{justifyContent:'space-between',marginBottom:8}}>
                <strong>AI 채점 — {cur.title}</strong>
                {grade.score !== null && grade.score !== undefined &&
                  <span className="tag gold">{grade.score} / {cur.points || 100}점</span>}
              </div>
              {grade.error &&
                <div className="pre" style={{color:'var(--no)',marginBottom:8}}>{grade.error}</div>}
              <div className="gv" dangerouslySetInnerHTML={{__html: renderGrade(grade.text) + (grade.running ? '<span class="gv-p">▌</span>' : '')}} />
              {!grade.running && grade.score !== null && grade.score !== undefined &&
                <div className="muted" style={{marginTop:8}}>
                  점수와 피드백이 이 기기의 기록에 저장되었습니다.</div>}
            </div>}
        </div>
      </div>
    </div>
  );
}

/* ── 앱 ─────────────────────────────────────────────── */
function App(){
  // Store.getUser()는 로그인 전에도 null을 준다. "아직 안 읽음"과 구분하려면
  // 준비 플래그가 따로 있어야 한다 — 없으면 로그인 안내가 못 뜨고 계속 로딩이다.
  const [ready,setReady] = useState(false);
  const [uid,setUid] = useState(null);
  const [subject,setSubject] = useState(
    ()=>INCOMING_SUBJECT || localStorage.getItem('record_subject') || SUBJECTS[0]);
  // 목록에서 고르면 index.json 항목이 오지만, 링크로 들어오면 id 만 안다 — Solve 는 id 로 파일을 받으므로 충분하다
  const [exam,setExam] = useState(()=>INCOMING_SUBJECT ? {id:INCOMING_EXAM} : null);
  const back = ()=>{
    setExam(null);
    // 뒤로 간 뒤 새로고침하면 다시 그 회차가 열리지 않게 주소의 ?exam= 을 지운다
    if(location.search) history.replaceState(null, '', location.pathname + location.hash);
  };
  const [theme,setTheme] = useState(
    ()=>document.documentElement.getAttribute('data-theme'));

  useEffect(()=>{
    Store.init({}).then(()=>{ setUid(Store.getUser()); setReady(true); })
      .catch(()=>setReady(true));
  },[]);
  useEffect(()=>{ localStorage.setItem('record_subject', subject); },[subject]);

  const toggleTheme = ()=>{
    const t = theme==='dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('cp_theme', t); setTheme(t);
  };

  if(!ready) return <div className="empty">불러오는 중…</div>;
  if(!uid) return (
    <div className="wrap">
      <div className="card" style={{marginTop:60,textAlign:'center'}}>
        <div className="title">허브에서 로그인해 주세요</div>
        <div className="muted" style={{marginBottom:12}}>
          네 앱이 같은 사용자 ID를 씁니다.</div>
        <a className="btn pri" href="/">허브로 이동</a>
      </div>
    </div>
  );

  return (
    <div>
      <div className="hd">
        <div>
          <h1>기록형 연습</h1>
          <div className="sub">{subject} · 변호사시험 · 법전협 모의고사</div>
        </div>
        <div className="row">
          <select className="btn" value={subject}
            onChange={e=>{ setSubject(e.target.value); setExam(null); }}>
            {SUBJECTS.map(s=><option key={s} value={s}>{s}</option>)}
          </select>
          <button className="btn ghost" onClick={toggleTheme}>{theme==='dark'?'☀':'🌙'}</button>
          <a className="btn ghost" href="/" title="다른 앱 고르기">◀ 앱</a>
        </div>
      </div>
      <div className={"wrap"+(exam?" wide":"")}>
        {exam
          ? <Solve subject={subject} exam={exam} onBack={back} />
          : <List subject={subject} onOpen={setExam} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
// 오프라인 대응. 답안 초안은 IndexedDB 에 있으니 껍데기와 문제 데이터만 살려 두면
// 신호가 끊긴 곳에서도 이어서 쓸 수 있다.
if('serviceWorker' in navigator){
  // 새 워커가 제어권을 넘겨받으면 한 번만 새로고침한다 — 없으면 배포 직후 방문자에게
  // 캐시에 남은 옛 화면이 그대로 보이고 손으로 새로고침하기 전까지 회복하지 못한다.
  const 최초등록 = !navigator.serviceWorker.controller;
  let 새로고침함 = false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(최초등록 || 새로고침함) return;
    새로고침함 = true; location.reload();
  });
  window.addEventListener('load',()=>{
    // updateViaCache:'none' — sw.js 가 HTTP 캐시에 붙잡히면 새 배포를 못 본다.
    navigator.serviceWorker.register('/RECORD_Practice/sw.js',{updateViaCache:'none'}).catch(()=>{});
  });
}
</script>
